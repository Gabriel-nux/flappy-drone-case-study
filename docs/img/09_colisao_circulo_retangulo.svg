<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 330' width='760' height='330' font-family='Geist, Segoe UI, Arial, sans-serif'><rect width='760' height='330' fill='#0d1b1e' rx='10'/><text x='40' y='30' font-size='16' fill='#e8efe9' text-anchor='start' font-weight='bold'>Colisão círculo × retângulo: ponto mais próximo</text><text x='40' y='48' font-size='12' fill='#8aa3a0' text-anchor='start' font-weight='normal'>nearest = clamp(centro, borda do retângulo); colide se |centro − nearest|² &lt; r²</text><rect x='150' y='205' width='220' height='105' fill='#ff5a4e' fill-opacity='.18' stroke='#ff5a4e' stroke-width='2'/><text x='260.0' y='262.5' font-size='13' fill='#ff5a4e' text-anchor='middle' font-weight='normal'>rack (AABB)</text><circle cx='90' cy='135' r='34' fill='none' stroke='#2dd4bf' stroke-width='3'/><circle cx='90' cy='135' r='3' fill='#2dd4bf'/><line x1='90' y1='135' x2='150' y2='205' stroke='#e8efe9' stroke-dasharray='4 3'/><circle cx='150' cy='205' r='4' fill='#e8efe9'/><text x='136' y='129' font-size='12' fill='#2dd4bf' text-anchor='start' font-weight='normal'>distância 92 px &gt; r=34: passa</text><rect x='56' y='101' width='68' height='68' fill='none' stroke='#f59e0b' stroke-dasharray='3 3'/><text x='76' y='187' font-size='12' fill='#f59e0b' text-anchor='start' font-weight='normal'>a caixa do círculo (laranja) já encostaria no rack</text><text x='440' y='150' font-size='14' fill='#e8efe9' text-anchor='start' font-weight='bold'>Por que círculo e não caixa</text><text x='440' y='176' font-size='13' fill='#e8efe9' text-anchor='start' font-weight='normal'>• a hélice, a antena e as quinas do sprite não contam;</text><text x='440' y='200' font-size='13' fill='#e8efe9' text-anchor='start' font-weight='normal'>• raspão diagonal na quina é perdoado;</text><text x='440' y='224' font-size='13' fill='#e8efe9' text-anchor='start' font-weight='normal'>• o círculo não “enrosca” em canto de rack;</text><text x='440' y='248' font-size='13' fill='#e8efe9' text-anchor='start' font-weight='normal'>• raio de 17 px sobre um sprite de 80×58 px.</text></svg>